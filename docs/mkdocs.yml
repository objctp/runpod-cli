site_name: Runpod CLI (rp)
site_url: https://objctp.github.io/runpod-cli/manual/
repo_url: https://github.com/objctp/runpod-cli
docs_dir: .
site_dir: ../site/manual
extra_css:
- stylesheets/extra.css
theme:
  name: material
  custom_dir: theme
  features:
  - navigation.sections
  - navigation.indexes
  - navigation.top
  - content.code.copy
  - search.suggest
  palette:
  - scheme: slate
    primary: black
    accent: indigo
    toggle:
      icon: material/weather-sunny
      name: Switch to light mode
  - scheme: default
    primary: black
    accent: indigo
    toggle:
      icon: material/weather-night
      name: Switch to dark mode
use_directory_urls: true
markdown_extensions:
- admonition
- toc
- tables
- fenced_code
nav:
- Manual: index.md
- How-to: how-to/index.md

name: docs

# Build the MkDocs Material manual and publish it to GitHub Pages.
# The site is served under /manual/ (see site_url in docs/mkdocs.yml).
#
# Two gates prevent needless redeploys:
#   1. `paths` only starts the workflow when docs or this file change.
#   2. the build hashes the rendered site and skips the upload+deploy when it is
#      byte-identical to the previous successful build (cached), so a docs edit
#      that does not alter the rendered output costs nothing.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.hash.outputs.skip }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r docs/requirements-docs.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: mkdocs build --strict -f docs/mkdocs.yml

      - name: Add root redirect to /manual/
        run: |
          cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=/runpod-cli/manual/" />
              <link rel="canonical" href="/runpod-cli/manual/" />
              <title>runpod-cli manual</title>
            </head>
            <body>
              <p>Redirecting to the <a href="/runpod-cli/manual/">runpod-cli manual</a>&hellip;</p>
            </body>
          </html>
          EOF

      # Restore the previously built site (if any) so we can compare hashes.
      - name: Restore previous site
        uses: actions/cache/restore@v4
        with:
          path: site-prev
          key: docs-site-${{ github.run_id }}
          restore-keys: |
            docs-site-

      - name: Compare with previous build
        id: hash
        run: |
          hash_site() {
            cd "$1" && find . -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1
          }
          NEW="$(hash_site site)"
          if [ -d site-prev ] && [ "$(hash_site site-prev)" = "$NEW" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Rendered site unchanged since last deploy — skipping upload/deploy."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Stage the current site as the comparison baseline for the next run.
      - name: Stage site for caching
        if: steps.hash.outputs.skip != 'true'
        run: rm -rf site-prev && cp -r site site-prev

      - name: Save site cache
        uses: actions/cache/save@v4
        if: steps.hash.outputs.skip != 'true'
        with:
          path: site-prev
          key: docs-site-${{ github.run_id }}

      - name: Upload artifact
        if: steps.hash.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

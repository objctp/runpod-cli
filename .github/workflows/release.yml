name: release

# Publishes a GitHub Release whenever scripts/changelog.sh release pushes a bare
# semver tag (1.0.0, no "v" prefix — matches cliff.toml's tag_pattern). The
# pipeline, in order:
#   1. build the universal tarball (rp is bash, so no per-OS/arch matrix) and its
#      SHA256SUMS, stamping the version into lib/_version.sh;
#   2. publish the GitHub Release (tarball + SHA256SUMS + changelog notes);
#   3. publish the npm package @objctp/rp with OIDC provenance (dry-run gated);
#   4. bump the Homebrew formula in objctp/homebrew-tap (brew audit/style/test
#      gated; committed via a PAT/deploy key).
on:
  push:
    tags:
      - "[0-9].*"

# id-token:write lets `npm publish --provenance` mint an OIDC provenance
# attestation; contents:write lets the Release be created and the tap be bumped
# through the GITHUB_TOKEN where possible.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build tarball and checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          printf 'RP_VERSION="%s"\n' "$VERSION" > lib/_version.sh
          tar czf "rp-$VERSION.tar.gz" bin lib commands LICENSE
          sha256sum "rp-$VERSION.tar.gz" > SHA256SUMS
          echo "Built rp-$VERSION.tar.gz"
          cat SHA256SUMS

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          # Extract the section after "# Changelog" up to the next "## [" or EOF
          # This captures only the latest release's formatted notes
          NOTES=$(awk '
            /^# Changelog/ { in_changelog=1; next }
            in_changelog && /^## \[/ {
              if (!found_first) { found_first=1; next }  # Skip the first "## [" header
              else { exit }                               # Stop at the second "## ["
            }
            found_first && in_changelog { print }         # Print content after first header
          ' CHANGELOG.md)
          # Add to GitHub Output (multiline, use EOF delimiter)
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            rp-${{ github.ref_name }}.tar.gz
            SHA256SUMS
          body: ${{ steps.notes.outputs.notes }}

      # ── npm channel (@objctp/rp) ──────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Stamp and validate the npm package
        run: node scripts/build.mjs

      - name: npm publish (dry-run gate)
        # No --provenance here: an attestation can't be minted without a real
        # publish, and attempting it makes the dry-run fail and block the step below.
        run: npm publish --dry-run --access public

      - name: npm publish @objctp/rp
        # NODE_AUTH_TOKEN carries a publish token; --provenance attaches an OIDC
        # attestation minted from the id-token:write permission above.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@objctp/rp@${GITHUB_REF_NAME}" version >/dev/null 2>&1; then
            echo "npm: @objctp/rp@${GITHUB_REF_NAME} already published, skipping"
          else
            npm publish --access public --provenance
          fi

      # ── Homebrew channel (objctp/homebrew-tap) ────────────
      - name: Setup Homebrew
        # ubuntu-latest has no brew, so install it; otherwise the audit/style/test
        # gate below would silently no-op and ship an unverified formula.
        uses: Homebrew/actions/setup-homebrew@2026.08.14.1

      - name: Bump Homebrew formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Install/test the formula we just generated, not the stale one Homebrew
          # would fetch from the remote tap on auto-update (which clobbers the
          # local edit and fails the version assertion). The edited formula is
          # still pushed to objctp/homebrew-tap at the end of this step.
          export HOMEBREW_NO_AUTO_UPDATE=1
          : "${TAP_TOKEN:?HOMEBREW_TAP_TOKEN secret is required to push the formula}"
          SHA256="$(awk '{print $1}' SHA256SUMS)"
          TAP_DIR="$(mktemp -d)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/objctp/homebrew-tap.git" "$TAP_DIR"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generate Formula/rp.rb. The shebang is rewritten to the brewed Bash
          # 5+ (macOS ships 3.2), and there is no man page.
          cat > Formula/rp.rb <<RB
          class Rp < Formula
            desc "CLI for managing RunPod infrastructure (volumes, serverless, pods, billing)"
            homepage "https://github.com/objctp/runpod-cli"
            url "https://github.com/objctp/runpod-cli/releases/download/${VERSION}/rp-${VERSION}.tar.gz"
            sha256 "${SHA256}"
            license "MIT"

            depends_on "bash"

            def install
              inreplace "bin/rp", %r{^#!/usr/bin/env bash}, "#!#{formula_opt_bin("bash")}/bash"
              prefix.install Dir["bin", "lib", "commands", "LICENSE"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/rp version")
            end
          end
          RB

          # Commit the generated formula locally BEFORE tapping/installing. A
          # `git clone` (which `brew tap` performs) only copies *committed*
          # state, so an uncommitted edit would be invisible and the stale
          # released version would be tested. HOMEBREW_NO_AUTO_UPDATE (set above)
          # stops brew from pulling the remote tap at install time. The push
          # below still bumps the version in objctp/homebrew-tap.
          git add Formula/rp.rb
          git commit -m "rp ${VERSION}"

          brew tap objctp/tap "$TAP_DIR"
          brew trust objctp/tap
          brew audit objctp/tap/rp
          brew style objctp/tap/rp
          brew install objctp/tap/rp
          brew test objctp/tap/rp

          git push

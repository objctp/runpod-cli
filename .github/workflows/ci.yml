name: ci

# Lint + unit tests on both macOS and Linux. Running the suite on macOS exercises
# the BSD branch (stat -f) in lib/common.sh:_warn_if_world_readable, while Linux
# exercises the GNU branch (stat -c) — keeping the portability code live on CI.
#
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install modern bash (macOS only)
        if: runner.os == 'macOS'
        run: |
          brew install bash shellcheck
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install bashunit
        uses: TypedDevs/bashunit@0.44.0
        with:
          version: "0.44.0"

      - name: make lint (shellcheck)
        run: make lint

      - name: bashunit unit suite
        run: bashunit tests/unit
